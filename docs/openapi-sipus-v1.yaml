openapi: 3.0.3

info:
  title: SIPUS-Del REST API
  version: 1.0.0
  description: |
    Kontrak resmi layanan RESTful Web API Sistem Informasi Perpustakaan IT Del (SIPUS-Del),
    Tugas Mandiri Minggu 9 mata kuliah Pemrograman dan Pengujian Aplikasi Web (12S3101).

    **Karakteristik layanan**
    - Stateless: autentikasi memakai Laravel Sanctum Bearer Token (`Authorization: Bearer <token>`).
    - Richardson Maturity Model Level 3: setiap representasi menyertakan tautan hypermedia `_links`.
      - `pinjam_buku` hanya muncul jika stok buku > 0.
      - `kembalikan_buku` hanya muncul jika status peminjaman masih `dipinjam`.
    - Seluruh galat dikembalikan dalam format **RFC 7807** (`application/problem+json`).
    - Transaksi sirkulasi dibungkus `DB::transaction()` + `lockForUpdate()` (ACID).

    **Amplop respons sukses**: `{ success, message, data, meta? }`

    **Akun uji (seeder)**: `pustakawan@del.ac.id` / `password123`

    Layanan SOAP legacy (cek bebas pustaka) didokumentasikan terpisah melalui kontrak WSDL
    di `GET /soap/sipus.wsdl`.
  contact:
    name: UPT Perpustakaan IT Del
    email: pustakawan@del.ac.id

servers:
  - url: http://localhost:8000/api/v1
    description: Local Development Server

tags:
  - name: Root
    description: Titik masuk API (HATEOAS entry point)
  - name: Auth
    description: Otentikasi stateless berbasis Sanctum Bearer Token
  - name: Kategori
    description: Katalog kategori buku (baca-saja)
  - name: Buku
    description: Katalog buku (REST Provider)
  - name: Peminjaman
    description: Transaksi sirkulasi peminjaman & pengembalian (ACID)
  - name: Referensi Eksternal
    description: Metadata buku dari OpenLibrary (REST Consumer)

paths:
  /:
    get:
      tags: [Root]
      summary: Titik masuk API beserta tautan ke seluruh resource utama
      operationId: getApiRoot
      responses:
        '200':
          description: Informasi layanan dan `_links`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRootResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Menerbitkan Bearer Token (dibatasi 5 percobaan per menit)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login berhasil, `access_token` diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Kombinasi email atau password tidak cocok
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: http://localhost:8000/docs/errors/invalid-credentials
                title: Invalid Credentials
                status: 401
                detail: Kombinasi email atau password yang diberikan tidak cocok.
                instance: /api/v1/auth/login
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      tags: [Auth]
      summary: Profil pemilik token aktif
      operationId: me
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil user dan informasi token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Mencabut (revoke) token yang sedang dipakai
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token berhasil dicabut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /kategoris:
    get:
      tags: [Kategori]
      summary: Daftar kategori beserta jumlah buku
      operationId: listKategori
      responses:
        '200':
          description: Koleksi kategori
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KategoriCollectionResponse'

  /kategoris/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Kategori]
      summary: Detail satu kategori
      operationId: showKategori
      responses:
        '200':
          description: Kategori ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KategoriResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /bukus:
    get:
      tags: [Buku]
      summary: Katalog buku terpaginasi (pencarian, filter, pengurutan)
      operationId: listBuku
      parameters:
        - name: search
          in: query
          description: Kata kunci pada judul, penulis, atau ISBN
          schema:
            type: string
          example: data
        - name: kategori_id
          in: query
          schema:
            type: integer
          example: 2
        - name: tersedia
          in: query
          description: Isi `1` untuk hanya menampilkan buku dengan stok > 0
          schema:
            type: integer
            enum: [0, 1]
        - name: sort
          in: query
          description: Kolom pengurutan (whitelist)
          schema:
            type: string
            enum: [id, judul, penulis, tahun_terbit, stok, created_at]
            default: judul
        - name: dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Koleksi buku beserta blok `meta` paginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BukuCollectionResponse'
    post:
      tags: [Buku]
      summary: Menambah buku baru
      operationId: createBuku
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '201':
          description: Buku berhasil dibuat
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BukuResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /bukus/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Buku]
      summary: Detail buku beserta kategori dan riwayat peminjaman
      operationId: showBuku
      responses:
        '200':
          description: Buku ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BukuResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Buku]
      summary: Mengganti seluruh representasi buku (Full Replacement)
      description: |
        Seluruh field wajib dikirim. Field nullable (`sinopsis`) yang tidak dikirim akan
        di-reset menjadi `null`.
      operationId: replaceBuku
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '200':
          description: Seluruh representasi buku berhasil diganti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BukuResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Buku]
      summary: Mengubah sebagian atribut buku (Partial Update)
      description: Hanya field yang dikirim yang divalidasi dan diubah. Body kosong ditolak dengan 400.
      operationId: patchBuku
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuPatch'
            example:
              stok: 8
      responses:
        '200':
          description: Atribut buku berhasil diperbarui sebagian
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BukuPatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Buku]
      summary: Menghapus buku (ditolak 409 jika masih ada peminjaman aktif)
      operationId: deleteBuku
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Buku berhasil dihapus (tanpa body)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Buku masih dipinjam
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: http://localhost:8000/docs/errors/buku-has-active-loans
                title: Conflict — Book Has Active Loans
                status: 409
                detail: Buku "Jaringan Komputer untuk Pemula" tidak dapat dihapus karena masih dipinjam oleh 1 peminjam.
                instance: /api/v1/bukus/4

  /bukus/{id}/referensi-eksternal:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Referensi Eksternal]
      summary: Metadata buku dari OpenLibrary berdasarkan ISBN (dibatasi 30 per menit)
      description: |
        SIPUS-Del berperan sebagai Service Consumer yang memanggil
        `https://openlibrary.org/isbn/{isbn}.json` dengan batas waktu yang diatur melalui `.env`.
        Hasil sukses di-cache 24 jam (`meta.sumber = cache`).
      operationId: showReferensiEksternal
      parameters:
        - name: refresh
          in: query
          description: Isi `1` untuk melewati cache dan memanggil OpenLibrary ulang
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: Ringkasan metadata eksternal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferensiEksternalResponse'
        '404':
          description: Buku tidak ada di katalog, atau ISBN tidak terdaftar di OpenLibrary
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: http://localhost:8000/docs/errors/referensi-eksternal-tidak-ditemukan
                title: External Reference Not Found
                status: 404
                detail: ISBN 9788172213701 tidak terdaftar di OpenLibrary.
                instance: /api/v1/bukus/1/referensi-eksternal
        '422':
          description: Buku tidak memiliki ISBN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: Layanan OpenLibrary tidak dapat dihubungi atau merespons galat
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '504':
          description: Layanan OpenLibrary tidak merespons dalam batas waktu
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /peminjamans:
    get:
      tags: [Peminjaman]
      summary: Daftar transaksi peminjaman terpaginasi
      operationId: listPeminjaman
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [dipinjam, dikembalikan]
        - name: nim
          in: query
          schema:
            type: string
          example: 12S24004
        - name: buku_id
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Koleksi peminjaman beserta blok `meta`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeminjamanCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Peminjaman]
      summary: Mencatat peminjaman baru (DB::transaction + lockForUpdate)
      description: |
        Urutan pengecekan di dalam transaksi, sebelum stok diubah:
        1. Buku tidak ada → **404**
        2. NIM masih meminjam buku yang sama → **409**
        3. Stok < 1 → **422** "Stok buku sedang habis"
        4. Lolos → stok −1, peminjaman dicatat → **201** + `Location`
      operationId: createPeminjaman
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeminjamanInput'
      responses:
        '201':
          description: Peminjaman berhasil dicatat
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeminjamanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: NIM masih meminjam buku yang sama
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: http://localhost:8000/docs/errors/duplicate-active-loan
                title: Duplicate Loan Conflict
                status: 409
                detail: Mahasiswa dengan NIM '12S24099' masih meminjam buku "Algoritma dan Struktur Data dengan Python" dan belum mengembalikannya.
                instance: /api/v1/peminjamans
        '422':
          description: Gagal validasi input atau stok buku habis
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: http://localhost:8000/docs/errors/stok-habis
                title: Unprocessable Content
                status: 422
                detail: Stok buku sedang habis. Buku "Pengantar Kecerdasan Buatan" belum dapat dipinjam.
                instance: /api/v1/peminjamans
                errors:
                  buku_id:
                    - Stok buku sedang habis.

  /peminjamans/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Peminjaman]
      summary: Detail satu transaksi peminjaman
      operationId: showPeminjaman
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Peminjaman ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeminjamanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /peminjamans/{id}/kembalikan:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Peminjaman]
      summary: Mengembalikan buku (DB::transaction + lockForUpdate)
      description: Status menjadi `dikembalikan`, `tanggal_kembali` diisi, stok buku +1.
      operationId: kembalikanPeminjaman
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Buku berhasil dikembalikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PengembalianResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Peminjaman sudah dikembalikan sebelumnya
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: http://localhost:8000/docs/errors/loan-already-returned
                title: Loan Already Returned
                status: 409
                detail: Peminjaman PJM-20261107-IRR0X sudah dikembalikan pada 2026-11-07.
                instance: /api/v1/peminjamans/7/kembalikan

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Token dari `POST /auth/login` (contoh format `1|AbCdEf...`)

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: ID numerik resource
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      description: Jumlah item per halaman (dibatasi 1–50)
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

  headers:
    Location:
      description: URL resource yang baru dibuat
      schema:
        type: string
        format: uri
        example: http://localhost:8000/api/v1/bukus/32

  responses:
    BadRequest:
      description: Permintaan tidak valid (misalnya body PATCH kosong)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: http://localhost:8000/docs/errors/empty-patch-payload
            title: Bad Request
            status: 400
            detail: Permintaan PATCH wajib menyertakan minimal satu atribut yang ingin diperbarui.
            instance: /api/v1/bukus/31
    Unauthorized:
      description: Bearer Token tidak ada, salah, atau sudah dicabut
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: http://localhost:8000/docs/errors/unauthenticated
            title: Unauthorized
            status: 401
            detail: Akses ditolak. Sertakan Bearer Token yang valid pada header Authorization.
            instance: /api/v1/bukus
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: http://localhost:8000/docs/errors/buku-not-found
            title: Resource Not Found
            status: 404
            detail: Buku dengan ID '999999' tidak ditemukan di katalog.
            instance: /api/v1/bukus/999999
    ValidationError:
      description: Gagal validasi input
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: http://localhost:8000/docs/errors/validation-failed
            title: Unprocessable Content
            status: 422
            detail: Satu atau lebih atribut input yang dikirim tidak memenuhi aturan validasi.
            instance: /api/v1/bukus
            errors:
              isbn:
                - The isbn has already been taken.
    TooManyRequests:
      description: Melampaui batas rate limiting
      headers:
        Retry-After:
          description: Jumlah detik sebelum boleh mencoba lagi
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    # ------------------------------------------------------------------
    # Umum
    # ------------------------------------------------------------------
    ProblemDetails:
      type: object
      description: Format galat standar IETF RFC 7807
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          example: http://localhost:8000/docs/errors/validation-failed
        title:
          type: string
          example: Unprocessable Content
        status:
          type: integer
          example: 422
        detail:
          type: string
        instance:
          type: string
          example: /api/v1/bukus
        errors:
          type: object
          description: Daftar pesan galat per atribut (khusus galat validasi)
          additionalProperties:
            type: array
            items:
              type: string

    SuccessEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    Link:
      type: object
      required: [href, method]
      properties:
        href:
          type: string
          format: uri
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        body:
          type: object
          description: Contoh body yang perlu dikirim (khusus tautan aksi POST)
          additionalProperties: true

    Links:
      type: object
      description: Kontrol hypermedia HATEOAS
      additionalProperties:
        $ref: '#/components/schemas/Link'

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        from:
          type: integer
          nullable: true
        to:
          type: integer
          nullable: true
        links:
          type: object
          properties:
            first:
              type: string
              format: uri
            prev:
              type: string
              format: uri
              nullable: true
            next:
              type: string
              format: uri
              nullable: true
            last:
              type: string
              format: uri

    MessageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              nullable: true

    ApiRootResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                service:
                  type: string
                  example: SIPUS-Del REST API
                version:
                  type: string
                  example: v1
                _links:
                  $ref: '#/components/schemas/Links'

    # ------------------------------------------------------------------
    # Auth
    # ------------------------------------------------------------------
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: pustakawan@del.ac.id
        password:
          type: string
          format: password
          example: password123
        device_name:
          type: string
          maxLength: 100
          example: postman-client

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Pustakawan Del
        email:
          type: string
          format: email
          example: pustakawan@del.ac.id

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                token_type:
                  type: string
                  example: Bearer
                access_token:
                  type: string
                  example: 1|AbCdEfGhIjKlMnOpQrStUvWxYz0123456789
                expires_at:
                  type: string
                  format: date-time
                user:
                  $ref: '#/components/schemas/User'
                _links:
                  $ref: '#/components/schemas/Links'

    MeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                user:
                  $ref: '#/components/schemas/User'
                token:
                  type: object
                  properties:
                    name:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    last_used_at:
                      type: string
                      format: date-time
                      nullable: true
                    expires_at:
                      type: string
                      format: date-time
                      nullable: true

    # ------------------------------------------------------------------
    # Kategori
    # ------------------------------------------------------------------
    Kategori:
      type: object
      properties:
        id:
          type: integer
          example: 2
        kode_kategori:
          type: string
          example: SI
        nama_kategori:
          type: string
          example: Sistem Informasi
        jumlah_buku:
          type: integer
          description: Hanya muncul pada endpoint kategori
        _links:
          $ref: '#/components/schemas/Links'

    KategoriResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Kategori'

    KategoriCollectionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Kategori'
            meta:
              type: object
              properties:
                total_items:
                  type: integer

    # ------------------------------------------------------------------
    # Buku
    # ------------------------------------------------------------------
    BukuInput:
      type: object
      required: [isbn, judul, penulis, penerbit, tahun_terbit, kategori_id, stok]
      properties:
        isbn:
          type: string
          description: ISBN-13 (tanda hubung dan spasi dibersihkan otomatis), harus unik
          example: 978-602-1234-567
        judul:
          type: string
          maxLength: 255
          example: Arsitektur Berorientasi Layanan
        penulis:
          type: string
          maxLength: 150
          example: Silvia Sitorus
        penerbit:
          type: string
          maxLength: 150
          example: Informatika Bandung
        tahun_terbit:
          type: integer
          minimum: 1000
          example: 2025
        kategori_id:
          type: integer
          description: Harus ada di tabel kategoris
          example: 2
        stok:
          type: integer
          minimum: 0
          maximum: 100000
          example: 3
        sinopsis:
          type: string
          nullable: true
          maxLength: 5000
          example: Membahas SOAP, REST, dan microservices untuk sistem informasi kampus.

    BukuPatch:
      type: object
      minProperties: 1
      description: Minimal satu atribut dari BukuInput
      properties:
        isbn:
          type: string
        judul:
          type: string
          maxLength: 255
        penulis:
          type: string
          maxLength: 150
        penerbit:
          type: string
          maxLength: 150
        tahun_terbit:
          type: integer
          minimum: 1000
        kategori_id:
          type: integer
        stok:
          type: integer
          minimum: 0
          maximum: 100000
        sinopsis:
          type: string
          nullable: true
          maxLength: 5000

    Buku:
      type: object
      properties:
        id:
          type: integer
          example: 4
        isbn:
          type: string
          example: '9792548484510'
        judul:
          type: string
          example: Jaringan Komputer untuk Pemula
        penulis:
          type: string
        penerbit:
          type: string
        tahun_terbit:
          type: integer
        stok:
          type: integer
          example: 2
        tersedia:
          type: boolean
          example: true
        status_label:
          type: string
          enum: [TERSEDIA, HABIS]
        sinopsis:
          type: string
          nullable: true
        kategori:
          $ref: '#/components/schemas/Kategori'
        total_peminjaman:
          type: integer
        peminjaman_aktif:
          type: integer
        riwayat_peminjaman:
          type: array
          description: Hanya muncul pada detail buku (maksimal 20 riwayat terbaru)
          items:
            $ref: '#/components/schemas/Peminjaman'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/Links'

    BukuResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Buku'

    BukuPatchResponse:
      allOf:
        - $ref: '#/components/schemas/BukuResponse'
        - type: object
          properties:
            meta:
              type: object
              properties:
                updated_fields:
                  type: array
                  items:
                    type: string
                  example: [stok]

    BukuCollectionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Buku'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------------------------
    # Peminjaman
    # ------------------------------------------------------------------
    PeminjamanInput:
      type: object
      required: [buku_id, nim_peminjam, nama_peminjam]
      properties:
        buku_id:
          type: integer
          example: 1
        nim_peminjam:
          type: string
          maxLength: 15
          example: 12S24099
        nama_peminjam:
          type: string
          maxLength: 150
          example: Mahasiswa Uji API
        durasi_hari:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
          example: 7

    Peminjaman:
      type: object
      properties:
        id:
          type: integer
          example: 7
        kode_pinjam:
          type: string
          example: PJM-20261107-IRR0X
        nim_peminjam:
          type: string
          example: 12S24099
        nama_peminjam:
          type: string
          example: Mahasiswa Uji API
        status:
          type: string
          enum: [dipinjam, dikembalikan]
        tanggal_pinjam:
          type: string
          format: date
        tanggal_jatuh_tempo:
          type: string
          format: date
        tanggal_kembali:
          type: string
          format: date
          nullable: true
        terlambat:
          type: boolean
        buku:
          type: object
          description: Ringkasan buku (hanya jika relasi dimuat)
          properties:
            id:
              type: integer
            isbn:
              type: string
            judul:
              type: string
        _links:
          $ref: '#/components/schemas/Links'

    PeminjamanResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Peminjaman'

    PengembalianResponse:
      allOf:
        - $ref: '#/components/schemas/PeminjamanResponse'
        - type: object
          properties:
            meta:
              type: object
              properties:
                terlambat:
                  type: boolean
                hari_terlambat:
                  type: integer

    PeminjamanCollectionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Peminjaman'
            meta:
              $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------------------------
    # Referensi Eksternal (REST Consumer)
    # ------------------------------------------------------------------
    ReferensiEksternal:
      type: object
      properties:
        judul:
          type: string
          nullable: true
          example: 'Clean Code: A Handbook of Agile Software Craftsmanship'
        penerbit:
          type: string
          nullable: true
          example: Prentice Hall
        jumlah_halaman:
          type: integer
          nullable: true
          example: 431
        tanggal_terbit:
          type: string
          nullable: true
          example: July 2008
        url:
          type: string
          format: uri
          example: https://openlibrary.org/books/OL26222911M
        sampul_url:
          type: string
          format: uri
          example: https://covers.openlibrary.org/b/isbn/9780132350884-M.jpg

    ReferensiEksternalResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                buku:
                  type: object
                  properties:
                    id:
                      type: integer
                    isbn:
                      type: string
                    judul:
                      type: string
                referensi_eksternal:
                  $ref: '#/components/schemas/ReferensiEksternal'
                _links:
                  $ref: '#/components/schemas/Links'
            meta:
              type: object
              properties:
                provider:
                  type: string
                  example: OpenLibrary
                sumber:
                  type: string
                  enum: [openlibrary, cache]
